[package]
name = "pagezest"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = "0.4.40"
phf = { version = "0.11.3", features = ["macros"] }
psutil = "3.0.0"
rusqlite = "0.34.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.140"
thiserror = "2.0.12"
wasmi = "0.44.0"
rust-embed="8.7.0"
actix-web = "4"
actix-files = "0.6.6"
env_logger = "0.10.0"
mime_guess = "2.0.5"
bson = "2.14.0"
criterion = "0.5.1"

[features]
default = ["embed_admin_ui", "embed_styles"]
embed_admin_ui = []
embed_styles = []
feature_reusable_vm = []


[[bench]]
name = "bson_benchmark"
harness = false
