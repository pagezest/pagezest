[package]
name = "pagezest"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = "0.4.40"
psutil = "5.2.0"
rusqlite = "0.34.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.140"
thiserror = "2.0.12"
tiny_http = "0.12.0"
tinywasm = "0.8.0"
eyre = "0.6.12"
wamr-rust-sdk = { git = "https://github.com/bytecodealliance/wamr-rust-sdk" }
wasmi = { version = "0.42.0", default-features = false, features = ["std"] }
