[package]
name = "pagezest"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = "0.4.40"
psutil = "3.0.0"
rusqlite = "=0.32.0"
sqlx = { version = "0.8.5", features = [ "runtime-async-std-native-tls", "sqlite", "sqlx-sqlite", "any", "macros"]}
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.140"
thiserror = "2.0.12"
wasmtime = { version = "32.0.0", features = ["async"] }
rust-embed="8.7.0"
actix-web = "4"
actix-files = "0.6.6"
env_logger = "0.10.0"
mime_guess = "2.0.5"
flatbuffers = "25.2.10"
base64 = "0.22.1"
futures = "0.3.31"

[features]
default = ["embed_admin_ui", "embed_styles"]
embed_admin_ui = []
embed_styles = []
feature_reusable_vm = []


[[bench]]
name = "bson_benchmark"
harness = false

